# /etc/nginx/sites-available/portfolio
# Symlink into sites-enabled, then run `certbot --nginx -d <host>`.
# Replace <host> with the public hostname.

server {
    listen 80;
    listen [::]:80;
    server_name <host>;

    # certbot will rewrite this block to add SSL + 443.

    # Modest body limit: the vault PUT carries a single encrypted JSON
    # blob and is capped at 1 MB on the server. 2 MB here gives slack
    # for base64 framing.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/stream
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

