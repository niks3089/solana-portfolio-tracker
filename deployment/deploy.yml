---
# Quick deploy - only sync code and restart service
- name: Deploy Portfolio Dashboard (Code Only)
  hosts: portfolio_servers
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - "{{ playbook_dir }}/vars/prod.yml"
    - "{{ playbook_dir }}/vars/vault.yml"

  tasks:
    - name: Sync portfolio code
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=deployment"

    - name: Set correct ownership
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
        recurse: yes

    - name: Install dependencies
      npm:
        path: "{{ app_dir }}"
        state: present
      become: true
      become_user: "{{ app_user }}"

    - name: Restart portfolio service
      systemd:
        name: portfolio
        state: restarted
        daemon_reload: yes

    - name: Check service health
      uri:
        url: "http://localhost:{{ app_port }}/api/payment-config"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Display success
      debug:
        msg: "Deployed successfully! https://{{ domain_name }}"

