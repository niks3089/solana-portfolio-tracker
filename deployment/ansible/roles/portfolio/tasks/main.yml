---
# ============================================================================
# Portfolio Dashboard - Full Server Setup
# Works for both staging (no SSL) and production (with SSL)
# ============================================================================

- name: Update and upgrade apt packages
  apt:
    upgrade: true
    update_cache: true

# ============================================================================
# PostgreSQL 17 Installation
# ============================================================================
- name: Install prerequisites for PostgreSQL
  apt:
    name:
      - wget
      - gnupg2
      - lsb-release
      - curl
      - ca-certificates
      - acl
      - python3-psycopg2
    state: present

- name: Add PostgreSQL APT repository key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL APT repository
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL 17
  apt:
    name:
      - postgresql-17
      - postgresql-contrib-17
      - libpq-dev
    state: present
    update_cache: true

- name: Ensure PostgreSQL is started and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create portfolio database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    state: present

- name: Create portfolio database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    password: "{{ postgres_password }}"
    state: present

- name: Grant all privileges on database
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ postgres_db }}"
    privs: ALL
    type: database
    role: "{{ postgres_user }}"

- name: Grant schema privileges
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ postgres_db }}"
    privs: ALL
    type: schema
    objs: public
    role: "{{ postgres_user }}"

# ============================================================================
# Node.js Installation
# ============================================================================
- name: Check if Node.js is already installed
  command: node --version
  register: node_check
  failed_when: false
  changed_when: false

- name: Install Node.js prerequisites
  apt:
    name:
      - nodejs
      - npm
    state: present
  when: node_check.rc != 0

- name: Install n (Node.js version manager)
  npm:
    name: n
    global: yes
  when: node_check.rc != 0

- name: Install Node.js 20 LTS
  command: n 20
  when: node_check.rc != 0

- name: Locate node binary
  command: which node
  register: node_path
  changed_when: false

- name: Ensure /usr/local/bin/node symlink (systemd service expects this path)
  file:
    src: "{{ node_path.stdout }}"
    dest: /usr/local/bin/node
    state: link
    force: yes
  when: node_path.stdout != "/usr/local/bin/node"

# ============================================================================
# Application setup
# ============================================================================
- name: Create application user
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes
    state: present

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Sync portfolio code
  synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ app_dir }}"
    delete: yes
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=.env"
      - "--exclude=deployment"

- name: Set correct ownership for application directory
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
    recurse: yes

- name: Install application dependencies
  npm:
    path: "{{ app_dir }}"
    state: present
  become: true
  become_user: "{{ app_user }}"

- name: Create environment file
  template:
    src: portfolio.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0600'
  notify: Restart portfolio service

- name: Initialize database tables
  command: npm run db:init
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    DATABASE_URL: "postgresql://{{ postgres_user }}:{{ postgres_password }}@localhost:5432/{{ postgres_db }}"

# ============================================================================
# Systemd service
# ============================================================================
- name: Create systemd service file
  template:
    src: portfolio.service.j2
    dest: /etc/systemd/system/portfolio.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart portfolio service

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start portfolio service
  systemd:
    name: portfolio
    state: started
    enabled: yes

# ============================================================================
# UFW Firewall
# ============================================================================
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'

- name: Allow application port
  ufw:
    rule: allow
    port: "{{ app_port }}"

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

# ============================================================================
# Nginx (always installed, SSL conditional)
# ============================================================================
- name: Install Nginx
  apt:
    name: nginx
    state: present

# ============================================================================
# SSL Certificate (PRODUCTION ONLY)
# ============================================================================
- name: Install Certbot
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
  when: enable_ssl | default(false)

- name: Create certbot webroot directory
  file:
    path: /var/www/certbot
    state: directory
    mode: '0755'
  when: enable_ssl | default(false)

- name: Check if SSL certificate exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: ssl_cert
  when: enable_ssl | default(false)

- name: Stop nginx for initial cert generation
  systemd:
    name: nginx
    state: stopped
  when:
    - enable_ssl | default(false)
    - ssl_cert is defined
    - not ssl_cert.stat.exists

- name: Generate SSL certificate
  command: >
    certbot certonly --standalone
    -d {{ domain_name }}
    --email {{ ssl_email }}
    --agree-tos
    --non-interactive
  when:
    - enable_ssl | default(false)
    - ssl_cert is defined
    - not ssl_cert.stat.exists

# ============================================================================
# Nginx Configuration
# ============================================================================
- name: Configure Nginx (with SSL)
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/portfolio
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
  when: enable_ssl | default(false)

- name: Configure Nginx (without SSL - staging)
  template:
    src: nginx-nossl.conf.j2
    dest: /etc/nginx/sites-available/portfolio
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx
  when: not (enable_ssl | default(false))

- name: Enable Nginx site
  file:
    src: /etc/nginx/sites-available/portfolio
    dest: /etc/nginx/sites-enabled/portfolio
    state: link
  notify: Restart nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Start Nginx
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Set up SSL renewal cron job
  cron:
    name: "Renew Let's Encrypt certificates"
    minute: "0"
    hour: "3"
    job: "certbot renew --quiet && systemctl reload nginx"
  when: enable_ssl | default(false)
