---
# ============================================================================
# prod-new init playbook (no encrypted vault required).
# Mirrors init.yml but loads vars/vault-prod-new.yml instead of vars/vault.yml.
# 213.239.141.25 currently serves portfolio.niks3089.com — single-user prod.
# ============================================================================
- name: Initialize Portfolio Dashboard (prod-new env)
  hosts: portfolio_servers
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - "{{ playbook_dir }}/vars/base.yml"
    - "{{ playbook_dir }}/vars/vault-prod-new.yml"

  pre_tasks:
    - name: Display initialization target
      debug:
        msg:
          - "🔧 Initializing: {{ inventory_hostname }}"
          - "   Environment: {{ deploy_environment | default('unknown') }}"
          - "   Domain: {{ domain_name }}"
          - "   SSL: {{ enable_ssl | default(false) }}"

  roles:
    - role: ansible/roles/portfolio
      tags: [init]

  post_tasks:
    - name: Verify portfolio service is running
      systemd:
        name: portfolio
        state: started

    - name: Check service health
      uri:
        url: "http://localhost:{{ app_port }}/api/payment-config"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Display success
      debug:
        msg: "✅ Portfolio Dashboard initialized at http://{{ ansible_host }}:{{ app_port }}"
