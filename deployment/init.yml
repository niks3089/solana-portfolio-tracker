---
# Full initialization - PostgreSQL, Node.js, Nginx, SSL, App
- name: Initialize Portfolio Dashboard (Full Setup)
  hosts: portfolio_servers
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - "{{ playbook_dir }}/vars/prod.yml"
    - "{{ playbook_dir }}/vars/vault.yml"

  pre_tasks:
    - name: Debug deployment info
      debug:
        msg:
          - "Initializing: {{ inventory_hostname }}"
          - "Server: {{ server_name }}"
          - "Domain: {{ domain_name }}"

  roles:
    - role: ansible/roles/portfolio
      tags: [init]

  post_tasks:
    - name: Verify portfolio service is running
      systemd:
        name: portfolio
        state: started

    - name: Check service health
      uri:
        url: "http://localhost:{{ app_port }}/api/payment-config"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Display success
      debug:
        msg: "Portfolio Dashboard initialized successfully at https://{{ domain_name }}"

