---
# ============================================================================
# Full initialization - PostgreSQL, Node.js, Nginx, SSL, App
# Works for both staging and production
# ============================================================================
- name: Initialize Portfolio Dashboard (Full Setup)
  hosts: portfolio_servers
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - "{{ playbook_dir }}/vars/base.yml"
    - "{{ playbook_dir }}/vars/vault.yml"
    # Environment-specific vars loaded via command line: -e @vars/staging.yml or -e @vars/prod.yml

  pre_tasks:
    - name: Display initialization target
      debug:
        msg:
          - "🔧 Initializing: {{ inventory_hostname }}"
          - "   Environment: {{ environment | default('unknown') }}"
          - "   Domain: {{ domain_name }}"
          - "   SSL: {{ enable_ssl | default(false) }}"

  roles:
    - role: ansible/roles/portfolio
      tags: [init]

  post_tasks:
    - name: Verify portfolio service is running
      systemd:
        name: portfolio
        state: started

    - name: Check service health
      uri:
        url: "http://localhost:{{ app_port }}/api/payment-config"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Display success (with SSL)
      when: enable_ssl | default(false)
      debug:
        msg: "✅ Portfolio Dashboard initialized at https://{{ domain_name }}"

    - name: Display success (without SSL)
      when: not (enable_ssl | default(false))
      debug:
        msg: "✅ Portfolio Dashboard initialized at http://{{ domain_name }}:{{ app_port }}"
