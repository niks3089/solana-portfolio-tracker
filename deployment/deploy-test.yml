---
# ============================================================================
# Test-environment deploy playbook (no encrypted vault required).
# Mirrors deploy.yml but loads vars/vault-test.yml instead of vars/vault.yml.
# ============================================================================
- name: Deploy Portfolio Dashboard (TEST env)
  hosts: portfolio_servers
  become: yes
  vars_files:
    - vars/base.yml
    - vars/vault-test.yml

  tasks:
    - name: Display deployment target
      debug:
        msg: "🚀 Deploying to {{ deploy_environment | default('unknown') }} ({{ ansible_host }})"

    - name: Sync portfolio code
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=deployment"
          - "--exclude=.github"
          - "--exclude=.vault_pass"
        delete: yes

    - name: Set correct ownership
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    - name: Update environment file
      template:
        src: ansible/roles/portfolio/templates/portfolio.env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'
      notify: restart portfolio

    - name: Install dependencies
      shell: cd {{ app_dir }} && npm install --omit=dev
      become_user: "{{ app_user }}"

    - name: Restart portfolio service
      systemd:
        name: portfolio
        state: restarted
        daemon_reload: yes

    - name: Wait for service to start
      wait_for:
        port: "{{ app_port }}"
        delay: 2
        timeout: 30

    - name: Check service health
      uri:
        url: "http://localhost:{{ app_port }}/api/payment-config"
        return_content: yes
      register: health_check
      failed_when: health_check.status != 200

    - name: Display success
      debug:
        msg: "✅ Deployed to {{ deploy_environment | default('unknown') }} successfully!"

  handlers:
    - name: restart portfolio
      systemd:
        name: portfolio
        state: restarted
