name: Hourly Metrics Report

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Collect metrics from Production
        id: metrics
        run: |
          # Fetch metrics from production
          METRICS=$(curl -s "https://saul.run/api/metrics?secret=${{ secrets.METRICS_SECRET }}" || echo '{"error":"failed"}')

          # Parse metrics
          UPTIME=$(echo "$METRICS" | jq -r '.uptime // "N/A"')
          CACHE_HIT_RATE=$(echo "$METRICS" | jq -r '.cache.hitRate // "N/A"')
          CACHE_HITS=$(echo "$METRICS" | jq -r '.cache.hits // 0')
          CACHE_MISSES=$(echo "$METRICS" | jq -r '.cache.misses // 0')
          WALLETS_CACHED=$(echo "$METRICS" | jq -r '.uniqueWalletsTracked // 0')
          TOTAL_REQUESTS=$(echo "$METRICS" | jq -r '.requests.total // 0')

          # API stats
          BIRDEYE_CALLS=$(echo "$METRICS" | jq -r '.externalAPIs.birdeye.calls // 0')
          BIRDEYE_ERRORS=$(echo "$METRICS" | jq -r '.externalAPIs.birdeye.errors // 0')
          BIRDEYE_LATENCY=$(echo "$METRICS" | jq -r '.externalAPIs.birdeye.avgLatencyMs // 0')

          LAMBDA_CALLS=$(echo "$METRICS" | jq -r '.externalAPIs.lambda.calls // 0')
          LAMBDA_ERRORS=$(echo "$METRICS" | jq -r '.externalAPIs.lambda.errors // 0')

          DIALECT_CALLS=$(echo "$METRICS" | jq -r '.externalAPIs.dialect.calls // 0')
          DIALECT_ERRORS=$(echo "$METRICS" | jq -r '.externalAPIs.dialect.errors // 0')

          # Store for next step
          echo "uptime=$UPTIME" >> $GITHUB_OUTPUT
          echo "cache_hit_rate=$CACHE_HIT_RATE" >> $GITHUB_OUTPUT
          echo "cache_hits=$CACHE_HITS" >> $GITHUB_OUTPUT
          echo "cache_misses=$CACHE_MISSES" >> $GITHUB_OUTPUT
          echo "wallets=$WALLETS_CACHED" >> $GITHUB_OUTPUT
          echo "requests=$TOTAL_REQUESTS" >> $GITHUB_OUTPUT
          echo "birdeye_calls=$BIRDEYE_CALLS" >> $GITHUB_OUTPUT
          echo "birdeye_errors=$BIRDEYE_ERRORS" >> $GITHUB_OUTPUT
          echo "birdeye_latency=$BIRDEYE_LATENCY" >> $GITHUB_OUTPUT
          echo "lambda_calls=$LAMBDA_CALLS" >> $GITHUB_OUTPUT
          echo "dialect_calls=$DIALECT_CALLS" >> $GITHUB_OUTPUT

      - name: Collect Cloudflare Analytics
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        if: env.CF_TOKEN != '' && env.CF_ZONE != ''
        run: |
          # Get analytics for the last hour
          END_TIME=$(date -u +"%Y-%m-%dT%H:00:00Z")
          START_TIME=$(date -u -d "1 hour ago" +"%Y-%m-%dT%H:00:00Z" 2>/dev/null || date -u -v-1H +"%Y-%m-%dT%H:00:00Z")

          # Cloudflare GraphQL API for analytics
          CF_RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/graphql" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{
              "query": "query { viewer { zones(filter: {zoneTag: \"'"$CF_ZONE"'\"}) { httpRequests1hGroups(limit: 1, filter: {datetime_geq: \"'"$START_TIME"'\", datetime_lt: \"'"$END_TIME"'\"}) { sum { requests pageViews threats bytes } uniq { uniques } } } } }"
            }' 2>/dev/null || echo '{}')

          # Parse Cloudflare stats
          CF_REQUESTS=$(echo "$CF_RESPONSE" | jq -r '.data.viewer.zones[0].httpRequests1hGroups[0].sum.requests // 0' 2>/dev/null || echo "N/A")
          CF_PAGEVIEWS=$(echo "$CF_RESPONSE" | jq -r '.data.viewer.zones[0].httpRequests1hGroups[0].sum.pageViews // 0' 2>/dev/null || echo "N/A")
          CF_UNIQUES=$(echo "$CF_RESPONSE" | jq -r '.data.viewer.zones[0].httpRequests1hGroups[0].uniq.uniques // 0' 2>/dev/null || echo "N/A")
          CF_THREATS=$(echo "$CF_RESPONSE" | jq -r '.data.viewer.zones[0].httpRequests1hGroups[0].sum.threats // 0' 2>/dev/null || echo "0")

          echo "cf_requests=$CF_REQUESTS" >> $GITHUB_OUTPUT
          echo "cf_pageviews=$CF_PAGEVIEWS" >> $GITHUB_OUTPUT
          echo "cf_uniques=$CF_UNIQUES" >> $GITHUB_OUTPUT
          echo "cf_threats=$CF_THREATS" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Send Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Build message
          MESSAGE="📊 *Saul.run Hourly Report*%0A"
          MESSAGE+="─────────────────%0A"
          MESSAGE+="⏱ *Uptime:* ${{ steps.metrics.outputs.uptime }}%0A"
          MESSAGE+="📈 *Total Requests:* ${{ steps.metrics.outputs.requests }}%0A"
          MESSAGE+="👛 *Wallets Tracked:* ${{ steps.metrics.outputs.wallets }}%0A"
          MESSAGE+="%0A"
          MESSAGE+="💾 *Cache Performance*%0A"
          MESSAGE+="• Hit Rate: ${{ steps.metrics.outputs.cache_hit_rate }}%0A"
          MESSAGE+="• Hits: ${{ steps.metrics.outputs.cache_hits }} | Misses: ${{ steps.metrics.outputs.cache_misses }}%0A"
          MESSAGE+="%0A"
          MESSAGE+="🔌 *External APIs*%0A"
          MESSAGE+="• Birdeye: ${{ steps.metrics.outputs.birdeye_calls }} calls (~${{ steps.metrics.outputs.birdeye_latency }}ms)%0A"
          MESSAGE+="• Lambda: ${{ steps.metrics.outputs.lambda_calls }} calls%0A"
          MESSAGE+="• Dialect: ${{ steps.metrics.outputs.dialect_calls }} calls%0A"

          # Add Cloudflare stats if available
          if [ -n "${{ steps.cloudflare.outputs.cf_requests }}" ] && [ "${{ steps.cloudflare.outputs.cf_requests }}" != "N/A" ]; then
            MESSAGE+="%0A"
            MESSAGE+="☁️ *Cloudflare (Last Hour)*%0A"
            MESSAGE+="• Requests: ${{ steps.cloudflare.outputs.cf_requests }}%0A"
            MESSAGE+="• Unique Visitors: ${{ steps.cloudflare.outputs.cf_uniques }}%0A"
            MESSAGE+="• Threats Blocked: ${{ steps.cloudflare.outputs.cf_threats }}%0A"
          fi

          # Send to Telegram
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
            echo "✅ Report sent to Telegram"
          else
            echo "⚠️ Telegram credentials not configured"
          fi

