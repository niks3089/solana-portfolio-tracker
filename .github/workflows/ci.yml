name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Server — install, typecheck, build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Client — install, typecheck, build
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run build
