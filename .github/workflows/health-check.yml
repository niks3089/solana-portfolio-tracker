name: Health Check

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

env:
  API_URL: https://portfolio.niks3089.com
  TEST_WALLET: 5bAMwPjsGKrovga3csb9QX59RE8x3xneSBpDP1t8Hibb

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Payment Config API
        id: payment-config
        run: |
          echo "Testing /api/payment-config..."
          RESPONSE=$(curl -s --max-time 10 -w "\n%{http_code}" "${{ env.API_URL }}/api/payment-config")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Payment config failed with HTTP $HTTP_CODE"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Payment config API returned HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if freeMode is in response
          if ! echo "$BODY" | grep -q "freeMode"; then
            echo "❌ Payment config response missing freeMode field"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Payment config response invalid" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Payment config OK"
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Check Health API
        id: health-api
        run: |
          echo "Testing /api/health..."
          START_TIME=$(date +%s)

          RESPONSE=$(curl -s --max-time 10 -w "\n%{http_code}" \
            "${{ env.API_URL }}/api/health")

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response time: ${DURATION}s"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health API failed with HTTP $HTTP_CODE"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Health API returned HTTP $HTTP_CODE after ${DURATION}s" >> $GITHUB_OUTPUT
            echo "duration=$DURATION" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if response has expected fields
          if ! echo "$BODY" | grep -q '"status":"healthy"'; then
            echo "❌ Health check response indicates unhealthy"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Health check reported unhealthy status" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Health API OK"
          echo "status=ok" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Check Frontend Loads
        id: frontend
        run: |
          echo "Testing frontend..."
          RESPONSE=$(curl -s --max-time 10 -w "\n%{http_code}" "${{ env.API_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Frontend failed with HTTP $HTTP_CODE"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Frontend returned HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Check if HTML contains expected content
          if ! echo "$BODY" | grep -q "Solana Portfolio"; then
            echo "❌ Frontend HTML missing expected content"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "error=Frontend HTML invalid" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Frontend OK"
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Send Telegram Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Collect error info
          PAYMENT_ERROR="${{ steps.payment-config.outputs.error }}"
          HEALTH_ERROR="${{ steps.health-api.outputs.error }}"
          FRONTEND_ERROR="${{ steps.frontend.outputs.error }}"

          # Build message
          MESSAGE="🚨 *Portfolio Health Check Failed*%0A%0A"
          MESSAGE+="Time: $(date -u '+%Y-%m-%d %H:%M UTC')%0A%0A"

          if [ -n "$PAYMENT_ERROR" ]; then
            MESSAGE+="❌ Payment Config: $PAYMENT_ERROR%0A"
          fi
          if [ -n "$HEALTH_ERROR" ]; then
            MESSAGE+="❌ Health API: $HEALTH_ERROR%0A"
          fi
          if [ -n "$FRONTEND_ERROR" ]; then
            MESSAGE+="❌ Frontend: $FRONTEND_ERROR%0A"
          fi

          MESSAGE+="%0A[View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          # Send to Telegram
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true"
            echo "Telegram alert sent"
          else
            echo "Telegram credentials not configured, skipping alert"
          fi

      - name: Log Success
        if: success()
        run: |
          echo "==================================="
          echo "✅ All health checks passed!"
          echo "==================================="
          echo "Payment Config: OK"
          echo "Health API: OK"
          echo "Frontend: OK"

