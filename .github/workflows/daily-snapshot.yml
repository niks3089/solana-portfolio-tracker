name: Hourly Portfolio Snapshot

on:
  # Run hourly to spread load (only processes stale labels)
  schedule:
    - cron: '0 * * * *'
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Take hourly snapshot (Production)
        run: |
          echo "📸 Taking portfolio snapshots (stale labels only)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://saul.run/api/internal/snapshot?secret=${{ secrets.SNAPSHOT_SECRET }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Snapshot failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Snapshot completed successfully"

      - name: Send Telegram notification on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="🚨 Daily portfolio snapshot FAILED! Check GitHub Actions." \
              -d parse_mode="Markdown"
          fi


