name: Deploy Portfolio Dashboard

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      full_init:
        description: 'Run full initialization (includes PostgreSQL, Nginx, SSL)'
        required: false
        type: boolean
        default: false
  # Auto deploy on push to main
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOST_KEY_CHECKING: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and dependencies
        run: |
          pip install ansible
          cd deployment
          ansible-galaxy collection install -r requirements.yml

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy (code only)
        if: ${{ !inputs.full_init }}
        run: |
          cd deployment
          ansible-playbook deploy.yml

      - name: Full initialization
        if: ${{ inputs.full_init }}
        run: |
          cd deployment
          ansible-playbook init.yml
