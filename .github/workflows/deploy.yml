name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          LAMBDA_P2P_API_KEY: ${{ secrets.LAMBDA_P2P_API_KEY }}
          DIALECT_API_KEY: ${{ secrets.DIALECT_API_KEY }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          ENV_VARS="BIRDEYE_API_KEY=${BIRDEYE_API_KEY}"
          ENV_VARS="${ENV_VARS},HELIUS_API_KEY=${HELIUS_API_KEY}"
          ENV_VARS="${ENV_VARS},LAMBDA_P2P_API_KEY=${LAMBDA_P2P_API_KEY}"
          ENV_VARS="${ENV_VARS},DIALECT_API_KEY=${DIALECT_API_KEY}"
          ENV_VARS="${ENV_VARS},METRICS_SECRET=${METRICS_SECRET}"
          ENV_VARS="${ENV_VARS},TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
          ENV_VARS="${ENV_VARS},TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
          ENV_VARS="${ENV_VARS},TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}"
          ENV_VARS="${ENV_VARS},TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}"

          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=80 \
            --timeout=60s \
            --set-env-vars="${ENV_VARS}"

      - name: Sanity test
        if: ${{ vars.PROD_URL != '' }}
        run: |
          sleep 5
          chmod +x scripts/sanity-test.sh
          ./scripts/sanity-test.sh "${{ vars.PROD_URL }}"
